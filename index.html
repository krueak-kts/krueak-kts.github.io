<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบเช็คชื่อเข้าเรียน</title>
  
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <style>
    body { font-family: 'Sarabun', Tahoma, sans-serif; text-align: center; background-color: #f4f6f9; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
    h2 { color: #2c3e50; }
    button { background-color: #00B900; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold;}
    button:disabled { background-color: #cccccc; cursor: not-allowed; }
    #preview { max-width: 100%; border-radius: 8px; margin-top: 15px; border: 2px solid #ddd; }
    #status { margin-top: 15px; font-weight: bold; line-height: 1.5; }
    .profile-info { margin-bottom: 15px; font-size: 18px; color: #34495e;}
  </style>
</head>
<body>

  <div class="card">
    <h2>📍 เช็คชื่อเข้าเรียน</h2>
    <div id="profile" class="profile-info">กำลังเตรียมระบบ...</div>
    
    <input type="file" id="camera" accept="image/*" capture="environment" style="display:none;" onchange="handleImage(this)">
    <button id="btnCamera" onclick="document.getElementById('camera').click()" style="display:none;">📸 ถ่ายรูปเช็คชื่อ</button>
    
    <img id="preview" style="display: none;">
    <button id="btnSubmit" onclick="getLocationAndSubmit()" style="display:none; background-color:#2980b9;">✅ ยืนยันการเช็คชื่อ</button>
    <div id="status"></div>
  </div>

  <script>
    let userId = '';
    let imageBase64 = '';
    
    // ⚠️ นำลิงก์ Web App (ที่ลงท้ายด้วย /exec) ของคุณมาใส่ตรงนี้
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyIeIcSXLuQ1zRGcCzzME-50E-MUR6T6GhqBrAdOs9AVMULugZCNyj_uywuQI4eXO9vYg/exec"; 
    const LIFF_ID = "2010176412-U51gEMNp";
    
    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          userId = profile.userId;
          document.getElementById('profile').innerHTML = `สวัสดี<br><b>${profile.displayName}</b>`;
          document.getElementById('btnCamera').style.display = 'block';
        } else {
          document.getElementById('profile').innerHTML = 'กำลังพาไปหน้าล็อกอิน...';
          liff.login(); 
        }
      } catch (err) {
        document.getElementById('profile').innerHTML = '❌ การเชื่อมต่อล้มเหลว';
        document.getElementById('status').innerHTML = 'Error: ' + err.message;
        document.getElementById('status').style.color = 'red';
      }
    }
    
    function handleImage(input) {
       const file = input.files[0];
       if(!file) return;
       
       document.getElementById('status').innerHTML = ''; 
       const reader = new FileReader();
       reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
             const canvas = document.createElement('canvas');
             const MAX_WIDTH = 800;
             const scaleSize = MAX_WIDTH / img.width;
             canvas.width = MAX_WIDTH;
             canvas.height = img.height * scaleSize;
             const ctx = canvas.getContext('2d');
             ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
             
             const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
             document.getElementById('preview').src = dataUrl;
             document.getElementById('preview').style.display = 'block';
             
             imageBase64 = dataUrl.split(',')[1]; 
             document.getElementById('btnSubmit').style.display = 'block';
             document.getElementById('btnCamera').innerHTML = '📸 ถ่ายรูปใหม่';
          }
          img.src = e.target.result;
       }
       reader.readAsDataURL(file);
    }
    
    function getLocationAndSubmit() {
      document.getElementById('status').style.color = '#d35400';
      document.getElementById('status').innerHTML = "⏳ กำลังดึงพิกัด GPS...";
      document.getElementById('btnSubmit').disabled = true;
      document.getElementById('btnCamera').disabled = true;
      
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(sendDataToServer, showError, {
           enableHighAccuracy: true, timeout: 15000, maximumAge: 0
        });
      } else {
        document.getElementById('status').innerHTML = "❌ อุปกรณ์ไม่รองรับ GPS";
        enableButtons();
      }
    }
    
    // ฟังก์ชันส่งข้อมูลด้วย API แทนที่ google.script.run
    function sendDataToServer(position) {
      document.getElementById('status').innerHTML = "⏳ กำลังบันทึกข้อมูล...";
      
      const payload = {
        userId: userId,
        lat: position.coords.latitude,
        lng: position.coords.longitude,
        imageBase64: imageBase64,
        mimeType: 'image/jpeg'
      };
      
      // ส่งคำสั่ง POST ไปยัง Google Apps Script
      fetch(GAS_URL, {
        redirect: "follow",
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // ป้องกันปัญหา CORS
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(data => {
         document.getElementById('status').innerHTML = data.message;
         if(data.success) {
            document.getElementById('status').style.color = 'green';
            setTimeout(() => { if(liff.isInClient()) liff.closeWindow(); }, 3000); 
         } else {
            document.getElementById('status').style.color = 'red';
            enableButtons();
         }
      })
      .catch(error => {
         document.getElementById('status').style.color = 'red';
         document.getElementById('status').innerHTML = "❌ ติดต่อเซิร์ฟเวอร์ไม่ได้: " + error.message;
         enableButtons();
      });
    }
    
    function showError(error) {
       let msg = "❌ หาตำแหน่งไม่ได้ (โปรดเปิด GPS)";
       document.getElementById('status').innerHTML = msg;
       enableButtons();
    }

    function enableButtons() {
       document.getElementById('btnSubmit').disabled = false;
       document.getElementById('btnCamera').disabled = false;
    }
    
    main();
  </script>
</body>
</html>
