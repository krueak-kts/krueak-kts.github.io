<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกพิกัดและข้อมูลนักเรียน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    #preview { max-width: 100%; max-height: 200px; margin: 10px auto; display: none; border-radius: 12px; object-fit: cover; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
    
    <div id="lineProfile" class="flex items-center space-x-4 mb-6 p-3 bg-blue-50 rounded-xl hidden">
      <img id="lineAvatar" class="w-12 h-12 rounded-full border-2 border-blue-400" src="" alt="Avatar">
      <div>
        <p class="text-xs text-gray-500">ผู้ใช้งาน LINE</p>
        <p id="lineNameTxt" class="font-semibold text-gray-800"></p>
      </div>
    </div>

    <div id="panel-loading" class="text-center py-8">
      <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full mb-4"></div>
      <p class="text-gray-600 font-medium">กำลังตรวจสอบข้อมูลการลงทะเบียน...</p>
    </div>

    <div id="panel-register" class="hidden space-y-4">
      <h3 class="text-lg font-bold text-red-600 text-center">ยังไม่ได้ลงทะเบียนสิทธิ์ในระบบ</h3>
      <p class="text-sm text-gray-500 text-center">กรุณากรอกรหัสนักเรียนเพื่อตรวจสอบข้อมูลและยืนยันตัวตน</p>
      
      <div>
        <label class="block text-gray-700 text-sm font-semibold mb-1">เลขประจำตัวนักเรียน</label>
        <div class="flex space-x-2">
          <input type="text" id="reg-student-id" class="w-full px-3 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
          <button type="button" onclick="searchStudent()" id="btn-search" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm hover:bg-blue-700 whitespace-nowrap">ตรวจสอบ</button>
        </div>
      </div>

      <div id="reg-info-box" class="bg-slate-50 p-4 rounded-xl border border-dashed hidden space-y-2 text-sm text-gray-700">
        <p class="font-bold text-blue-600 text-center text-base mb-1">กรุณาตรวจสอบชื่อ-สกุลให้ถูกต้อง</p>
        <p><strong>ชื่อ-นามสกุล:</strong> <span id="lbl-name"></span></p>
        <p><strong>ระดับชั้น:</strong> <span id="lbl-class"></span></p>
        
        <button type="button" onclick="confirmRegister()" id="btn-confirm-reg" class="w-full bg-green-600 text-white py-2.5 rounded-xl font-semibold hover:bg-green-700 transition mt-4">
          ถูกต้อง ยืนยันการลงทะเบียน
        </button>
      </div>
    </div>

    <div id="panel-gps" class="hidden">
      <h2 class="text-xl font-bold text-center text-blue-600 mb-4">บันทึกพิกัดและข้อมูลนักเรียน</h2>
      
      <form id="gpsForm" onsubmit="handleGpsSubmit(event)" class="space-y-4">
        <div class="grid grid-cols-2 gap-2 text-xs bg-slate-50 p-3 rounded-xl border">
          <div><span class="text-gray-400">รหัสนักเรียน:</span> <p id="view-id" class="font-bold text-gray-800"></p></div>
          <div><span class="text-gray-400">ชั้นเรียน:</span> <p id="view-class" class="font-bold text-gray-800"></p></div>
          <div class="col-span-2"><span class="text-gray-400">ชื่อ-สกุล:</span> <p id="view-name" class="font-bold text-gray-800 text-sm"></p></div>
        </div>

        <div>
          <label class="block text-gray-700 text-sm font-semibold mb-1">ชื่อเล่น <span class="text-red-500">*</span></label>
          <input type="text" id="nickname" required class="w-full px-3 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="text-center p-4 border-2 border-dashed border-gray-300 rounded-xl bg-slate-50">
          <label class="block text-gray-700 text-sm font-semibold mb-2">ถ่ายรูปบ้านพักอาศัย <span class="text-red-500">*</span></label>
          <input type="file" id="camera-file" accept="image/*" capture="environment" onchange="handleFileSelect(event)" class="hidden">
          
          <button type="button" onclick="document.getElementById('camera-file').click()" id="btn-camera" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700 transition">
            📸 เปิดกล้องถ่ายรูปบ้าน
          </button>
          
          <img id="preview" alt="Preview Image">
          <input type="hidden" id="imageBlob">
        </div>

        <div id="gpsStatus" class="text-xs text-center text-amber-600 font-medium bg-amber-50 py-2 rounded-lg">กำลังร้องขอพิกัด GPS...</div>

        <button type="submit" id="btn-submit" disabled class="w-full bg-blue-500 text-white py-3 rounded-xl font-semibold opacity-50 cursor-not-allowed hover:bg-blue-600 transition text-base">
          บันทึกข้อมูลพิกัดลงระบบ
        </button>
      </form>
    </div>

  </div>

  <script>
    const LIFF_ID = "2010211460-b5iFssqU"; // LIFF ID ของคุณ
    const GAS_WEB_APP_URL = "ใส่_URL_WEB_APP_ของ_GAS_ตรงนี้"; // ⚠️ นำลิงก์ที่ได้จากการ Deploy ใน GAS มาใส่ที่นี่

    let globalProfile = { userId: "", displayName: "" };
    let activeStudentData = null; // เก็บข้อมูลนักเรียนที่กำลังทำงานอยู่

    window.onload = function() {
      initLiff();
      getLocation();
    }

    // เรียกใช้ระบบไลน์และตรวจสอบข้อมูลครั้งแรก
    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          globalProfile.userId = profile.userId;
          globalProfile.displayName = profile.displayName;
          
          document.getElementById("lineNameTxt").innerText = profile.displayName;
          document.getElementById("lineAvatar").src = profile.pictureUrl || "https://via.placeholder.com/150";
          document.getElementById("lineProfile").classList.remove("hidden");
          
          // ตรวจสอบกับฝั่งหลังบ้านว่า Line ID นี้ลงทะเบียนไว้หรือยัง
          checkUserRegistration(profile.userId);
        }
      } catch (error) {
        alert("LIFF ทำงานผิดพลาด: " + error.message);
      }
    }

    // เรียก API ตรวจสอบสิทธิ์ไลน์ไอดี
    function checkUserRegistration(lineId) {
      callAPI("checkLineId", { lineId: lineId }, (res) => {
        document.getElementById("panel-loading").classList.add("hidden");
        if (res.status === "found") {
          activeStudentData = res;
          showGpsPanel(res);
        } else {
          document.getElementById("panel-register").classList.remove("hidden");
        }
      });
    }

    // หน้าจอลงทะเบียน: ค้นหาข้อมูลรหัสนักเรียน
    function searchStudent() {
      const studentId = document.getElementById("reg-student-id").value.trim();
      if (!studentId) return alert("กรุณากรอกรหัสนักเรียน");
      
      const btn = document.getElementById("btn-search");
      btn.innerText = "กำลังค้น...";
      btn.disabled = true;

      callAPI("checkStudentId", { studentId: studentId }, (res) => {
        btn.innerText = "ตรวจสอบ";
        btn.disabled = false;
        if (res.status === "success") {
          activeStudentData = res;
          document.getElementById("lbl-name").innerText = `${res.prefix}${res.firstName} ${res.lastName}`;
          document.getElementById("lbl-class").innerText = res.className;
          document.getElementById("reg-info-box").classList.remove("hidden");
        } else {
          alert(res.message);
          document.getElementById("reg-info-box").classList.add("hidden");
        }
      });
    }

    // หน้าจอลงทะเบียน: กดยืนยันผูก Line ID
    function confirmRegister() {
      if (!activeStudentData) return;
      const btn = document.getElementById("btn-confirm-reg");
      btn.innerText = "กำลังลงทะเบียน...";
      btn.disabled = true;

      const payload = {
        studentId: activeStudentData.studentId,
        lineId: globalProfile.userId,
        lineName: globalProfile.displayName
      };

      callAPI("registerLine", payload, (res) => {
        if (res.status === "success") {
          alert(res.message);
          document.getElementById("panel-register").classList.add("hidden");
          showGpsPanel(activeStudentData);
        } else {
          alert(res.message);
          btn.innerText = "ถูกต้อง ยืนยันการลงทะเบียน";
          btn.disabled = false;
        }
      });
    }

    // แสดงผลข้อมูลนักเรียนไปที่หน้ากรอก GPS
    function showGpsPanel(student) {
      document.getElementById("view-id").innerText = student.studentId;
      document.getElementById("view-class").innerText = student.className;
      document.getElementById("view-name").innerText = `${student.prefix}${student.firstName} ${student.lastName}`;
      document.getElementById("panel-gps").classList.remove("hidden");
      enableSubmitButton();
    }

    // ดึงพิกัดตำแหน่ง GPS มือถือ
    let currentLat = "", currentLng = "";
    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;
            const statusBox = document.getElementById("gpsStatus");
            statusBox.className = "text-xs text-center text-green-700 font-medium bg-green-50 py-2 rounded-lg";
            statusBox.innerText = `📌 ล็อกพิกัดบ้านเรียบร้อย (${currentLat.toFixed(5)}, ${currentLng.toFixed(5)})`;
            enableSubmitButton();
          },
          (error) => {
            const statusBox = document.getElementById("gpsStatus");
            statusBox.className = "text-xs text-center text-red-700 font-medium bg-red-50 py-2 rounded-lg";
            statusBox.innerText = "❌ ไม่สามารถดึงพิกัดได้ กรุณาเปิดระบบ GPS บนมือถือของคุณ";
            alert("กรุณาเปิดและอนุญาตให้สิทธิ์เข้าถึง GPS แก่แอปพลิเคชัน เพื่อการบันทึกข้อมูลพิกัดบ้านพัก");
          },
          { enableHighAccuracy: true, timeout: 15000 }
        );
      }
    }

    // จัดการเมื่อถ่ายรูปบ้านเสร็จ (แปลงรูปและย่อขนาดเป็น Base64)
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          
          const MAX_WIDTH = 800; // บีบขนาดความกว้างให้ภาพมีขนาดเบาส่งข้อมูลไว
          let width = img.width;
          let height = img.height;
          
          if (width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          }
          
          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);
          
          const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
          
          const preview = document.getElementById('preview');
          preview.src = dataUrl;
          preview.style.display = 'block';
          
          document.getElementById('imageBlob').value = dataUrl;
          document.getElementById('btn-camera').innerText = '🔄 ถ่ายรูปใหม่';
          
          enableSubmitButton();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // เปิดให้กดปุ่มส่งข้อมูลเมื่อพิกัดและรูปภาพครบถ้วนแล้วเท่านั้น
    function enableSubmitButton() {
      const img = document.getElementById("imageBlob").value;
      const btn = document.getElementById("btn-submit");
      if (currentLat && img && activeStudentData) {
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
      }
    }

    // ส่งข้อมูลพิกัดลงระบบฝั่ง AddGPS
    function handleGpsSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("btn-submit");
      btn.innerText = "⏳ กำลังบันทึกข้อมูลกรุณารอ...";
      btn.disabled = true;

      const payload = {
        studentId: activeStudentData.studentId,
        prefix: activeStudentData.prefix,
        firstName: activeStudentData.firstName,
        lastName: activeStudentData.lastName,
        className: activeStudentData.className,
        nickname: document.getElementById("nickname").value.trim(),
        lat: currentLat,
        lng: currentLng,
        imageBlob: document.getElementById("imageBlob").value,
        lineId: globalProfile.userId,
        lineName: globalProfile.displayName
      };

      callAPI("saveGPS", payload, (res) => {
        if (res.status === "success") {
          alert(res.message);
          liff.closeWindow();
        } else {
          alert("เกิดข้อผิดพลาด: " + res.message);
          btn.innerText = "บันทึกข้อมูลพิกัดลงระบบ";
          btn.disabled = false;
        }
      });
    }

    // ตัวเชื่อมกลางเรียกคุยข้ามโดเมนระหว่าง GitHub กับ Google Apps Script (Fetch API)
    function callAPI(action, data, callback) {
      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({ action: action, data: data })
      })
      .then(res => res.json())
      .then(callback)
      .catch(err => {
        alert("การเชื่อมต่อเซิร์ฟเวอร์หลังบ้านขัดข้อง: " + err.message);
      });
    }
  </script>
</body>
</html>
