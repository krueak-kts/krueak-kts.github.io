<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบบันทึกพิกัดและรูปถ่ายนักเรียน</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
    
    <div id="checkSection" class="block">
      <div class="text-center mb-6">
        <span class="text-5xl">📍</span>
        <h2 class="text-2xl font-bold text-gray-800 mt-2">ลงทะเบียนพิกัดนักเรียน</h2>
        <p class="text-sm text-gray-500">กรุณากรอกรหัสนักเรียนเพื่อเริ่มต้น</p>
      </div>
      
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-2">รหัสนักเรียน</label>
        <input type="number" id="studentIdInput" class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="กรอกรหัสนักเรียน 4 หลัก (เช่น 1720)">
      </div>
      
      <button onclick="checkID()" class="w-full bg-indigo-600 text-white font-semibold py-2.5 px-4 rounded-xl hover:bg-indigo-700 transition duration-200 shadow-md">
        ตรวจสอบข้อมูล
      </button>
    </div>

    <div id="formSection" class="hidden">
      <div class="border-b pb-3 mb-4 text-center">
        <h3 class="text-sm text-gray-400 font-medium">ชื่อ-นามสกุล นักเรียน</h3>
        <p id="studentNameDisplay" class="text-indigo-600 font-bold text-lg mt-0.5">-</p>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-1">ชื่อเล่น 👤</label>
        <input type="text" id="nicknameInput" class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="กรอกชื่อเล่น">
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-1">ชื่อหมู่บ้าน 🏠</label>
        <input type="text" id="villageInput" class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="กรอกชื่อหมู่บ้าน">
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-2">ถ่ายรูปหลักฐานสถานที่ 📸</label>
        <div class="relative overflow-hidden rounded-xl bg-black border aspect-video flex items-center justify-center">
          <video id="video" autoplay playsinline class="w-full h-full object-cover block"></video>
          <img id="photoPreview" class="hidden w-full h-full object-cover">
          <canvas id="canvas" class="hidden"></canvas>
        </div>
        
        <div class="flex gap-2 mt-2">
          <button id="captureBtn" onclick="capturePhoto()" class="w-full bg-teal-500 text-white font-medium py-2 px-4 rounded-xl hover:bg-teal-600 transition block">
            📷 กดถ่ายรูป
          </button>
          <button id="retakeBtn" onclick="startCamera()" class="hidden w-full bg-gray-500 text-white font-medium py-2 px-4 rounded-xl hover:bg-gray-600 transition">
            🔄 ถ่ายใหม่
          </button>
        </div>
      </div>

      <div class="flex flex-col gap-2 mt-6">
        <button onclick="submitData()" class="w-full bg-green-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-green-700 transition shadow-md">
          💾 บันทึกข้อมูลและพิกัด GPS
        </button>
        <button onclick="hideFormSection()" class="w-full bg-gray-100 text-gray-600 font-medium py-2 px-4 rounded-xl hover:bg-gray-200 transition text-center text-sm">
          ยกเลิกและกลับหน้าแรก
        </button>
      </div>
    </div>
  </div>

  <script>
    // --------------------------------------------------------
    // นำลิงก์ Web App (ที่ลงท้ายด้วย /exec) มาวางในเครื่องหมายคำพูดด้านล่างนี้
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxfIeCA58beRQSJs-_DEfcWUzn3Y9FjyActRsA9MnhaK4uq_O7hLZYSZnEFKtoB3IBlhg/exec";
    // --------------------------------------------------------

    let stream = null;
    let capturedImgBase64 = null;
    let currentStudentData = {};
    let isEditMode = false;
    let currentRowIndex = -1;

    async function checkID() {
      const studentId = document.getElementById('studentIdInput').value.trim();
      if (!studentId) {
        Swal.fire('คำเตือน', 'กรุณากรอกรหัสนักเรียน', 'warning');
        return;
      }
      
      Swal.fire({ title: 'กำลังตรวจสอบข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
      
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'check', studentId: studentId })
        });
        
        const data = await response.json();
        Swal.close();
        
        if (data.success) {
          currentStudentData = { id: studentId, firstName: data.firstName, lastName: data.lastName };
          
          if (data.exists) {
            Swal.fire({
              title: 'คุณเคยบันทึกข้อมูลแล้ว!',
              text: `${data.fullName} ต้องการแก้ไขข้อมูลเดิมใช่หรือไม่?`,
              icon: 'warning',
              showCancelButton: true,
              confirmButtonText: 'ใช่, แก้ไข',
              cancelButtonText: 'ยกเลิก'
            }).then((result) => {
              if (result.isConfirmed) {
                isEditMode = true;
                currentRowIndex = data.rowIndex;
                document.getElementById('studentNameDisplay').innerText = data.fullName + " (แก้ไข)";
                document.getElementById('nicknameInput').value = data.data.nickname || '';
                document.getElementById('villageInput').value = data.data.village || '';
                showFormSection();
              }
            });
          } else {
            isEditMode = false;
            currentRowIndex = -1;
            document.getElementById('studentNameDisplay').innerText = data.fullName;
            document.getElementById('nicknameInput').value = '';
            document.getElementById('villageInput').value = '';
            showFormSection();
          }
        } else {
          Swal.fire('ไม่พบข้อมูล', data.message, 'error');
        }
      } catch (err) {
        Swal.close();
        Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้: ' + err.message, 'error');
      }
    }

    function showFormSection() {
      document.getElementById('checkSection').className = 'hidden';
      document.getElementById('formSection').className = 'block';
      startCamera();
    }

    function hideFormSection() {
      document.getElementById('formSection').className = 'hidden';
      document.getElementById('checkSection').className = 'block';
      stopCamera();
      resetForm();
    }

    async function startCamera() {
      const video = document.getElementById('video');
      document.getElementById('photoPreview').className = 'hidden';
      document.getElementById('captureBtn').className = 'w-full bg-teal-500 text-white font-medium py-2 px-4 rounded-xl hover:bg-teal-600 transition block';
      document.getElementById('retakeBtn').className = 'hidden';
      capturedImgBase64 = null;
      video.className = 'w-full h-full object-cover block';

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("เบราว์เซอร์ไม่รองรับกล้อง");
        }
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
        } catch(err1) {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        }
        video.srcObject = stream;
      } catch (err) {
        console.error("Camera Error:", err);
        Swal.fire({ icon: 'error', title: 'ไม่สามารถเปิดกล้องได้', text: 'กรุณาอนุญาตให้เว็บเข้าถึงกล้องถ่ายรูป' });
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
    }

    function capturePhoto() {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      
      capturedImgBase64 = canvas.toDataURL('image/jpeg', 0.8);
      document.getElementById('photoPreview').src = capturedImgBase64;
      
      video.className = 'hidden';
      document.getElementById('photoPreview').className = 'w-full h-full object-cover block';
      document.getElementById('captureBtn').className = 'hidden';
      document.getElementById('retakeBtn').className = 'w-full bg-gray-500 text-white font-medium py-2 px-4 rounded-xl hover:bg-gray-600 transition block';
      stopCamera();
    }

    async function submitData() {
      const nickname = document.getElementById('nicknameInput').value.trim();
      const village = document.getElementById('villageInput').value.trim();
      
      if (!nickname || !village) return Swal.fire('คำเตือน', 'กรุณากรอกข้อมูลให้ครบถ้วน', 'warning');
      if (!capturedImgBase64) return Swal.fire('คำเตือน', 'กรุณาถ่ายรูปก่อนบันทึก', 'warning');
      
      Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
      
      if (!navigator.geolocation) {
        return Swal.fire('ข้อผิดพลาด', 'อุปกรณ์นี้ไม่รองรับระบบ GPS', 'error');
      }

      navigator.geolocation.getCurrentPosition(async function(position) {
        const payload = {
          studentId: currentStudentData.id,
          firstName: currentStudentData.firstName,
          lastName: currentStudentData.lastName,
          nickname: nickname,
          village: village,
          lat: position.coords.latitude,
          lng: position.coords.longitude,
          photoBase64: capturedImgBase64,
          isEdit: isEditMode,
          rowIndex: currentRowIndex
        };
        
        try {
          const response = await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'save', payload: payload })
          });
          const data = await response.json();
          Swal.close();
          
          if (data.success) {
            Swal.fire('สำเร็จ!', data.message, 'success').then(() => {
              hideFormSection();
              document.getElementById('studentIdInput').value = '';
            });
          } else {
            Swal.fire('ล้มเหลว', data.message, 'error');
          }
        } catch (err) {
          Swal.close();
          Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้: ' + err.message, 'error');
        }
      }, function(error) {
        Swal.close();
        Swal.fire('พิกัดล้มเหลว', 'กรุณาเปิดระบบหาพิกัด (GPS) และอนุญาตให้เว็บเข้าถึง', 'error');
      }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    }

    function resetForm() {
      capturedImgBase64 = null;
      currentStudentData = {};
      isEditMode = false;
      currentRowIndex = -1;
    }
  </script>
</body>
</html>
